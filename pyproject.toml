[build-system]
requires = [
    "setuptools>=61; python_version<'3.12'",
    "setuptools>=66.1; python_version>='3.12'",
]
build-backend = "setuptools.build_meta"

[project]
name = "wirely"
version = "0.1.4.dev0"
description = "Node-based language and runtime for low-level home automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Steffen Kieß"}]
dependencies = [
    "lark>=1.1.5",
    "sdnotify>=0.3.0",
    "cbor2>=5.4.5",
]

[project.urls]
Repository = "https://github.com/steffen-kiess/wirely"
Issues = "https://github.com/steffen-kiess/wirely/issues"

[project.optional-dependencies]
knx = ["xknx>=3.0,<4"]
mqtt = ["aiomqtt>=2.3,<3"]
two-n = ["aiohttp>=3.12,<4", "cryptography>=38.0.0"]
graphviz = ["graphviz>=0.20.1"]
gpio = ["gpiod>=2.1,<3"]
editor = ["PySide6-Essentials>=6.8"]
all = ["wirely[knx,mqtt,two-n,graphviz,gpio]"]
test = ["pyOpenSSL>=23.0.0", "mypy>=2.0"]
pex = ["pex"]
dev = ["wirely[test,pex]", "uv"]

[project.scripts]
wirely = "wirely.__main__:main"

[tool.setuptools.packages.find]
include = ["wirely*"]
namespaces = true

[tool.setuptools.package-data]
wirely = ["compiler/wirely.lark", "lib/*.wrl"]

[tool.mypy]
files = ["wirely"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# The graphviz output is not type checked.
module = ["wirely.cli.graphviz"]
ignore_errors = true

[[tool.mypy.overrides]]
# These packages have no type information, at least in the oldest supported versions.
module = ["cbor2", "gpiod", "gpiod.*", "graphviz", "OpenSSL", "OpenSSL.*", "sdnotify"]
ignore_missing_imports = true
